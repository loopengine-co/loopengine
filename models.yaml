# The models offered in the console's model dropdown (New agent, and an
# agent's Model > Edit), per provider: the ones suited to agents, which
# call tools over many steps. LoopEngine ships this file as the default.
#
# - A provider listed here offers exactly these models, in this order.
#   The first is preselected (for anthropic, "(provider default)" is).
#   No API key is needed to see them.
# - A workspace's own models.yaml (next to its .env) replaces this list
#   for each provider it names; the rest still come from here. Edit it
#   freely: changes show the next time the dropdown loads.
# - A provider listed in neither lists its models live from its API once
#   its key is saved on the Models page.
# - Any model can still be typed under "Other…".
#
# Providers: openai, anthropic, gemini, meta, xai, deepseek, kimi, glm.
# Set LOOPENGINE_MODELS_FILE to read a different workspace file.

# Taken from each provider's model pages and agent guides (2026-10-31),
# trimmed to models for agents and checked against the live model lists
# (2026-11-10). Older generations, "lite" and "mini" models are left out;
# type one under "Other…" to use it.

openai:
  - gpt-6.1-terra
  - gpt-6.1-sol
  - gpt-6-luna
  - gpt-6-sol
  - gpt-6-astra
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gpt-5.6-luna

anthropic:
  - claude-fable-5-2
  - claude-fable-5-1
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5

gemini:
  - gemini-4-argon
  - gemini-3.8-flash
  - gemini-3.7-flash
  - gemini-3.6-flash
  - gemini-3.1-pro-preview

# The "-contributor" variants are left out: they're cheaper, but let Meta
# train on the requests. Add one in your own models.yaml if that's fine.
meta:
  - muse-spark-1.3
  - muse-wonder
  - muse-spark-1.2
  - muse-spark-1.1

xai:
  - grok-4.7
  - grok-4.6
  - grok-4.5

# deepseek-v4-flash still works, but only as a retired alias of
# deepseek-flash.
deepseek:
  - deepseek-v4-pro
  - deepseek-flash

# K2 models aren't open to new Kimi accounts from 2026-10-31 and retire at
# the end of 2026, so only kimi-k2.7-code (the K2 coding line) is kept.
kimi:
  - kimi-k3.1-pro
  - kimi-k3
  - kimi-k2.7-code

# Zhipu's overview page shows display names; these are its lowercase API
# form.
glm:
  - glm-5.3
  - glm-5.2
  - glm-5.1
