# The models offered in the console's model dropdown (New agent, and an
# agent's Model > Edit), per provider: the ones suited to agents, which
# call tools over many steps. LoopEngine ships this file as the default.
#
# - A provider listed here offers exactly these models, in this order.
#   The first is preselected (for anthropic, "(provider default)" is).
#   No API key is needed to see them.
# - A workspace's own models.yaml (next to its .env) replaces this list
#   for each provider it names; the rest still come from here. Edit it
#   freely: changes show the next time the dropdown loads.
# - A provider listed in neither lists its models live from its API once
#   its key is saved on the Models page.
# - Any model can still be typed under "Other…".
#
# Providers: openai, anthropic, gemini, meta, xai, deepseek, kimi, glm.
# Set LOOPENGINE_MODELS_FILE to read a different workspace file.

# Taken from each provider's model pages and agent guides (2026-10-31),
# trimmed to models for agents and checked against the live model lists
# (2026-11-10), with later models added on 2026-11-24 (OpenAI's GPT-6.2
# and Gemini 4, both checked against the live lists). Older
# generations, "lite" and "mini" models are left out; type one under
# "Other…" to use it.

openai:
  - gpt-6.2-sol
  - gpt-6.2-astra
  - gpt-6.1-terra
  - gpt-6.1-sol
  - gpt-6-luna
  - gpt-6-sol
  - gpt-6-astra
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gpt-5.6-luna

anthropic:
  - claude-fable-5-2
  - claude-fable-5-1
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5

gemini:
  - gemini-4-neon
  - gemini-4-argon
  - gemini-4-carbon
  - gemini-4-hydrogen
  - gemini-3.8-flash
  - gemini-3.7-flash
  - gemini-3.6-flash
  - gemini-3.1-pro-preview

# The "-contributor" variants are left out: they're cheaper, but let Meta
# train on the requests. Add one in your own models.yaml if that's fine.
meta:
  - muse-spark-1.3
  - muse-wonder
  - muse-spark-1.2
  - muse-spark-1.1

xai:
  - grok-4.7
  - grok-4.6
  - grok-4.5

# deepseek-v4-flash still works, but only as a retired alias of
# deepseek-flash.
deepseek:
  - deepseek-v4-pro
  - deepseek-flash

# K2 models aren't open to new Kimi accounts from 2026-10-31 and retire at
# the end of 2026, so only kimi-k2.7-code (the K2 coding line) is kept.
kimi:
  - kimi-k3.1-pro
  - kimi-k3
  - kimi-k2.7-code

# Zhipu's overview page shows display names; these are its lowercase API
# form.
glm:
  - glm-5.3
  - glm-5.2
  - glm-5.1

# Prices, in US dollars per million tokens (standard tier, the base rate
# for shorter prompts), for the cost shown on each case and in a
# workflow's health. Taken from each provider's pricing page on
# 2026-11-24. A workspace's models.yaml can set its own, model by model.
# Not listed: gemini-3.7-flash (not on Google's pricing page).
# Known changes: gemini-4-argon and gemini-4-carbon double from
# 2026-12-01, gemini-3.8-flash and gemini-3.6-flash from 2027-01-01.
# DeepSeek's are its off-peak rates; at peak hours (weekdays 01:00-04:00
# and 06:00-10:00 UTC) it charges twice these.
prices:
  openai:
    gpt-6.2-sol: { input: 2.00, cached_input: 0.10, output: 10.00 }
    gpt-6.2-astra: { input: 8.00, cached_input: 0.40, output: 40.00 }
    gpt-6.1-terra: { input: 1.00, cached_input: 0.05, output: 5.00 }
    gpt-6.1-sol: { input: 2.00, cached_input: 0.10, output: 10.00 }
    gpt-6-luna: { input: 0.10, cached_input: 0.01, output: 0.50 }
    gpt-6-sol: { input: 2.00, cached_input: 0.20, output: 10.00 }
    gpt-6-astra: { input: 10.00, cached_input: 1.00, output: 50.00 }
    gpt-5.6-sol: { input: 4.00, cached_input: 0.40, output: 20.00 }
    gpt-5.6-terra: { input: 2.00, cached_input: 0.20, output: 12.00 }
    gpt-5.6-luna: { input: 0.20, cached_input: 0.02, output: 1.20 }
  anthropic:
    claude-fable-5-2: { input: 8, cached_input: 0.20, output: 40 }
    claude-fable-5-1: { input: 10, cached_input: 0.25, output: 50 }
    claude-opus-5-5: { input: 4, cached_input: 0.20, output: 20 }
    claude-sonnet-5-5: { input: 2, cached_input: 0.10, output: 10 }
    claude-haiku-5-5: { input: 0.10, cached_input: 0.01, output: 0.50 }
  gemini:
    gemini-4-neon: { input: 3.00, cached_input: 0.15, output: 15.00 }
    gemini-4-argon: { input: 2.00, cached_input: 0.10, output: 10.00 }
    gemini-4-carbon: { input: 2.00, cached_input: 0.10, output: 10.00 }
    gemini-4-hydrogen: { input: 1.50, cached_input: 0.075, output: 7.50 }
    gemini-3.8-flash: { input: 0.75, cached_input: 0.075, output: 3.75 }
    gemini-3.6-flash: { input: 0.75, cached_input: 0.075, output: 3.75 }
    gemini-3.1-pro-preview: { input: 2.00, cached_input: 0.20, output: 12.00 }
  meta:
    muse-spark-1.3: { input: 1.25, cached_input: 0.15, output: 4.25 }
    muse-wonder: { input: 4.00, cached_input: 0.20, output: 20.00 }
