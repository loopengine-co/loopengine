name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm trusted publishing (OIDC) — no NPM_TOKEN needed
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1 — newer than what
      # actions/setup-node's bundled npm may ship, so pin explicitly
      # rather than relying on the runner's default.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish
